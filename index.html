<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; form-action 'none'">
  <title>Gerador de Evolução Clínica</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <h1 class="marca">Evolução <span>clínica</span></h1>

    <label class="topo-campo">
      <span>Cenário</span>
      <select id="cenario"></select>
    </label>

    <div class="topo-campo">
      <span id="rot-sexo">Sexo</span>
      <div class="seg" role="group" aria-labelledby="rot-sexo">
        <button type="button" data-sexo="M" aria-pressed="true">M</button>
        <button type="button" data-sexo="F" aria-pressed="false">F</button>
      </div>
    </div>

    <div class="topo-acoes">
      <button type="button" id="restaurar" class="btn">Restaurar padrão</button>
      <button type="button" id="editar" class="btn" aria-pressed="false">Editar modelo</button>
    </div>
  </header>

  <main class="layout">
    <section class="esquerda" aria-label="Itens da evolução">
      <div id="itens"></div>
      <div id="editor" hidden></div>
    </section>

    <aside class="direita" aria-label="Texto final">
      <div class="saida-painel">
        <div class="saida-cab">
          <h2>Texto final</h2>
          <span class="legenda"><mark class="alt">alterado</mark> <span class="vazio">__</span> campo vazio</span>
        </div>
        <div id="saida" class="saida" aria-live="polite"></div>
        <div class="saida-rodape">
          <span id="contador">0 caracteres</span>
        </div>
        <button type="button" id="copiar" class="btn-copiar">Copiar</button>
      </div>
    </aside>
  </main>

  <script src="cenarios.js"></script>
  <script src="motor.js"></script>
  <script src="app.js"></script>
</body>
</html>
